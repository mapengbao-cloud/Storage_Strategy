function renderStats() {
    const s = DATA.summary;

// ======== TABLE ========
function getColorForSpread(spread, maxSp) {
    const t = Math.min(spread / maxSp, 1);
    const r = Math.round(100 + t * 155);
    const g = Math.round(200 - t * 180);
    const b = Math.round(100 - t * 100);
    return `rgb(${Math.min(r,255)},${Math.max(g,0)},${Math.max(b,0)})`;
}

function getSpreadClass(spread, avg) {
    if (spread > avg * 1.5) return 'neg';
    if (spread < avg * 0.5) return '';
    return '';
}

function renderTable(monthFilter) {
    const avgSp = DATA.summary.avg_spread;

    let html = '';
    const filtered = monthFilter === 'all'
        ? DATA.days
        : DATA.days.filter(d => d.date.startsWith(monthFilter));

    filtered.forEach(d => {
        const barColor = getColorForSpread(d.spread, MAX_SPREAD);
        const barW = Math.max(2, (d.spread / MAX_SPREAD) * 100);
        const cls = getSpreadClass(d.spread, avgSp);

        html += `<tr>
            <td>${d.date.slice(5)}</td>
            <td class="num">${d.daily_avg.toFixed(0)}</td>
            <td class="num"><strong style="color:#d46b08">${d.peak_val.toFixed(0)}</strong></td>
            <td><span class="tag tag-peak">${d.peak_time}</span></td>
            <td class="num neg"><strong>${d.valley_val.toFixed(0)}</strong></td>
            <td><span class="tag tag-valley">${d.valley_time}</span></td>
            <td class="num ${cls}"><strong>${d.spread.toFixed(0)}</strong></td>
            <td class="num">${d.spread_pct.toFixed(0)}%</td>
            <td style="text-align:left;padding:2px 12px;">
                <div class="spread-bar" style="width:${barW}%;background:${barColor};"></div>
            </td>
        </tr>`;
    });

    document.getElementById('tableBody').innerHTML = html;
}

function renderMonthlyTable() {
    let html = '';
    DATA.monthly.forEach(m => {
        const rangePct = ((m.max_daily_avg - m.min_daily_avg) / m.avg_daily_avg * 100).toFixed(0);
        html += `<tr>
            <td><strong>${m.month}</strong></td>
            <td>${m.days}</td>
            <td class="num">${m.avg_daily_avg.toFixed(0)}</td>
            <td class="num">${m.min_daily_avg.toFixed(0)} ~ ${m.max_daily_avg.toFixed(0)} (±${rangePct}%)</td>
            <td class="num"><strong>${m.avg_spread.toFixed(0)}</strong></td>
            <td class="num neg"><strong>${m.max_spread.toFixed(0)}</strong></td>
            <td class="num green"><strong>${m.min_spread.toFixed(0)}</strong></td>
            <td style="text-align:left;padding:2px 12px;">
                <div style="display:flex;gap:4px;align-items:center;">
                    <div class="spread-bar" style="width:${(m.min_spread/MAX_SPREAD*40).toFixed(0)}px;background:#91CC75;"></div>
                    <div class="spread-bar" style="width:${(m.avg_spread/MAX_SPREAD*40).toFixed(0)}px;background:#5470C6;"></div>
                    <div class="spread-bar" style="width:${(m.max_spread/MAX_SPREAD*40).toFixed(0)}px;background:#e34a4a;"></div>
                </div>
            </td>
        </tr>`;
    });
    document.getElementById('monthlyBody').innerHTML = html;
}

// ======== FILTERS ========
function setupFilters() {
    const months = [...new Set(DATA.days.map(d => d.date.slice(0, 7)))];
    const bar = document.getElementById('filterBar');
    months.forEach(m => {
        const btn = document.createElement('button');
        btn.textContent = m;
        btn.dataset.month = m;
        btn.onclick = () => {
            bar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable(m);
        };
        bar.appendChild(btn);
    });

    bar.querySelector('[data-month="all"]').onclick = () => {
        bar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-month="all"]').classList.add('active');
        renderTable('all');
    };
}

renderMonthlyChart();
renderTable('all');

setupFilters();
</script>
