function renderAll(data) {
    const D = data;

    // ---- header ----
    document.getElementById('headerTime').textContent = '更新: ' + D.update_time;

    // ---- insight ----
    const periods = Object.entries(D.period_stats).sort((a,b) => b[1].count - a[1].count);
    const topP = periods[0];
    const negCount = D.daily.filter(d => d.valley_val < 0).length;
    const negPct = (negCount / D.total_days * 100).toFixed(1);

    document.getElementById('insightBanner').innerHTML = `
        <h3>💡 关键发现</h3>
        <ul>
            <li><strong>${topP[0]}</strong>是谷值出现最多时段（${topP[1].count}天, ${topP[1].freq_pct}%）</li>
            <li><strong>${negCount}天</strong>（${negPct}%）的谷值为负电价，午间光伏大发是主因</li>
            <li>上午(06-10点)谷值均价 <strong>${D.period_stats['上午(06:00-10:00)']?.avg_valley?.toFixed(0) || '-'} 元</strong>，为全天最低时段</li>
            <li>凌晨谷值均价 <strong>${D.period_stats['凌晨(00:00-06:00)']?.avg_valley?.toFixed(0) || '-'} 元</strong>，显著高于白天</li>
        </ul>
    `;

    // ---- stats ----
    const negValleys = D.daily.filter(d => d.valley_val < 0).length;
    const stats = [
        { label: '分析天数', num: D.total_days, cls: 'blue', suffix: '天' },
        { label: '负谷值天数', num: negValleys, cls: 'red', suffix: `天 (${(negValleys/D.total_days*100).toFixed(0)}%)` },
        { label: '谷值均价', num: (D.daily.reduce((s,d)=>s+d.valley_val,0)/D.daily.length).toFixed(0), cls: 'orange', suffix: '元/MWh' },
        { label: '谷值最低', num: Math.min(...D.daily.map(d=>d.valley_val)).toFixed(0), cls: 'purple', suffix: '元/MWh' },
        { label: '最常见谷值时段', num: topP[0].replace(/\(.*\)/,''), cls: 'teal', suffix: `(${topP[1].count}天)` },
    ];
    document.getElementById('statCards').innerHTML = stats.map(s =>
        `<div class="stat-card ${s.cls}"><div class="label">${s.label}</div><div class="num">${s.num} <span style="font-size:13px;font-weight:400;opacity:.6">${s.suffix}</span></div></div>`
    ).join('');

    // ---- charts ----
    renderPeriodPie(D);
    renderHourBar(D);
    renderScatter(D);
    renderAvgByHour(D);
    renderMonthTrend(D);

    // ---- table ----
    D.daily.sort((a,b) => a.date.localeCompare(b.date));
    window._dailyData = D.daily;
    window._periodStats = D.period_stats;
    renderTable('all');

    // ---- label stats ----
    const sortedLabels = Object.entries(D.label_stats).sort((a,b) => b[1].count - a[1].count);
    const maxCnt = sortedLabels[0][1].count;
    let tbody = '';
    sortedLabels.forEach(([label, s]) => {
        tbody += `<tr>
            <td>${label}</td>
            <td>${s.count}</td>
            <td>${s.freq_pct}%</td>
            <td class="num ${s.avg_valley < 0 ? 'neg' : ''}">${s.avg_valley.toFixed(0)}</td>
            <td class="num">[${s.min_valley.toFixed(0)}, ${s.max_valley.toFixed(0)}]</td>
            <td style="text-align:left;padding:2px 12px;">
                <div class="bar-cell">
                    <div class="bar-seg" style="width:${(s.count/maxCnt*80).toFixed(0)}px;background:${s.avg_valley < 0 ? '#e34a4a' : '#5470C6'};"></div>
                    <span style="font-size:11px;color:#888;margin-left:4px;">${s.count}天</span>
                </div>
            </td>
        </tr>`;
    });
    document.getElementById('labelStatsBody').innerHTML = tbody;

    // ---- filter ----
    document.querySelectorAll('#filterBar button').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('#filterBar button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable(btn.dataset.period);
        };
    });
}

// ======== CHART: 时段分布饼图 ========
function renderPeriodPie(D) {
    const chart = echarts.init(document.getElementById('chartPeriodPie'));
    const ps = D.period_stats;
    const entries = Object.entries(ps).sort((a,b) => b[1].count - a[1].count);
    const colors = ['#5b4c8a','#e67e22','#f39c12','#388e3c','#c62828','#1565c0'];

    chart.setOption({
        title: { text: '谷值时段分布(大时段)', left: 'center', top: 2, textStyle: { fontSize: 14, fontWeight: 500 } },
        tooltip: {
            formatter: function(p) {
                const d = ps[p.name];
                return `<strong>${p.name}</strong><br/>天数: ${d.count}天<br/>频率: ${d.freq_pct}%<br/>谷值均价: ${d.avg_valley} 元/MWh`;
            }
        },
        series: [{
            type: 'pie',
            radius: ['35%', '62%'],
            center: ['50%', '55%'],
            data: entries.map(([name, stats], i) => ({
                name,
                value: stats.count,
                itemStyle: { color: colors[i % colors.length] },
            })),
            label: { formatter: '{b}\n{d}% ({c}天)', fontSize: 11 },
            emphasis: { scale: true, label: { show: true } },
        }],
    });
    window.addEventListener('resize', () => chart.resize());
}

// ======== CHART: 各小时频次 ========
function renderHourBar(D) {
    const chart = echarts.init(document.getElementById('chartHourBar'));
    const ha = D.hourly_avg;
    const hours = Array.from({length: 24}, (_, i) => i);
    const counts = hours.map(h => ha[h] ? ha[h].count : 0);
    const vals = hours.map(h => ha[h] ? ha[h].avg_valley : null);

    chart.setOption({
        title: { text: '各起始小时→谷值频次', left: 'center', top: 2, textStyle: { fontSize: 14, fontWeight: 500 } },
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                const h = params[0].dataIndex;
                const d = ha[h];
                if (!d) return `<strong>${h}:00</strong><br/>无谷值记录`;
                return `<strong>${h}:00</strong><br/>出现 ${d.count} 天<br/>谷值均价: ${d.avg_valley} 元/MWh<br/>范围: [${d.min_valley}, ${d.max_valley}]`;
            }
        },
        grid: { left: 50, right: 20, top: 36, bottom: 24 },
        xAxis: {
            type: 'category',
            data: hours.map(h => `${h}:00`),
            axisLabel: { fontSize: 9, interval: 0, rotate: 45 },
        },
        yAxis: { type: 'value', name: '天数', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 9 } },
        series: [{
            type: 'bar',
            data: hours.map((h, i) => ({
                value: counts[i],
                itemStyle: {
                    color: vals[i] !== null && vals[i] < 0 ? '#e34a4a' :
                           vals[i] !== null && vals[i] < 50 ? '#f39c12' :
                           vals[i] !== null ? '#5470C6' : '#ddd',
                    borderRadius: [2,2,0,0],
                }
            })),
        }],
    });
    window.addEventListener('resize', () => chart.resize());
}

// ======== CHART: 散点图(谷值 vs 时间) ========
function renderScatter(D) {
    const chart = echarts.init(document.getElementById('chartScatter'));
    const ptColors = {
        '凌晨(00:00-06:00)': '#5b4c8a',
        '上午(06:00-10:00)': '#e67e22',
        '中午(10:00-13:00)': '#f39c12',
        '下午(13:00-17:00)': '#388e3c',
        '傍晚(17:00-20:00)': '#c62828',
        '夜间(20:00-24:00)': '#1565c0',
    };
    const seriesData = {};
    D.daily.forEach(d => {
        const cat = d.valley_period;
        if (!seriesData[cat]) seriesData[cat] = [];
        const dayNum = Math.floor((new Date(d.date) - new Date('2026-01-01')) / 86400000);
        seriesData[cat].push({
            value: [dayNum, d.valley_val, d.date, d.valley_label],
            itemStyle: { color: ptColors[cat] || '#999' },
        });
    });

    const cats = Object.keys(seriesData).sort();
    const series = cats.map((cat, i) => ({
        name: cat,
        type: 'scatter',
        data: seriesData[cat],
        symbolSize: 8,
    }));

    chart.setOption({
        title: { text: '谷值价格 vs 时间分布（散点图）', left: 'center', top: 2, textStyle: { fontSize: 14, fontWeight: 500 } },
        tooltip: {
            formatter: function(p) {
                return `<strong>${p.data.value[2]}</strong><br/>谷值: ${p.data.value[1]} 元/MWh<br/>时段: ${p.data.value[3]}<br/>分类: ${p.seriesName}`;
            }
        },
        legend: {
            type: 'scroll',
            top: 28,
            textStyle: { fontSize: 11 },
        },
        grid: { left: 60, right: 30, top: 68, bottom: 40 },
        xAxis: {
            type: 'value',
            name: '日期(2026年)',
            nameTextStyle: { fontSize: 11 },
            axisLabel: {
                fontSize: 10,
                formatter: function(v) {
                    const d = new Date('2026-01-01');
                    d.setDate(d.getDate() + v);
                    return (d.getMonth()+1)+'/'+d.getDate();
                },
            },
            splitLine: { lineStyle: { type: 'dashed', color: '#eee' } },
        },
        yAxis: {
            type: 'value',
            name: '谷值 (元/MWh)',
            nameTextStyle: { fontSize: 11 },
            axisLabel: { fontSize: 10 },
            splitLine: { lineStyle: { type: 'dashed', color: '#eee' } },
        },
        dataZoom: [
            { type: 'inside', xAxisIndex: 0 },
            { type: 'slider', xAxisIndex: 0, height: 22, bottom: 5 },
        ],
        series: series,
    });
    window.addEventListener('resize', () => chart.resize());
}

            formatter: function(params) {
                const h = params[0].dataIndex;
                const d = ha[h];
                if (!d) return `<strong>${h}:00</strong><br/>无数据`;
                return `<strong>${h}:00</strong><br/>均价: ${d.avg_valley} 元/MWh<br/>范围: [${d.min_valley}, ${d.max_valley}]`;
            }
        },
        grid: { left: 50, right: 20, top: 36, bottom: 24 },
        xAxis: {
            type: 'category',
            data: hours.map(h => `${h}:00`),
            axisLabel: { fontSize: 9, interval: 0, rotate: 45 },
        },
        yAxis: { type: 'value', name: '元/MWh', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 9 } },
        series: [
            {
                name: '谷值均价',
                type: 'line',
                data: vals.map((v, i) => ({ value: v, itemStyle: { color: v < 0 ? '#e34a4a' : v < 50 ? '#f39c12' : '#5470C6' } })),
                smooth: true,
                symbol: 'circle',
                symbolSize: 6,
                lineStyle: { width: 2, color: '#2a7fc9' },
                areaStyle: { color: 'rgba(42,127,201,0.1)' },
            },
            {
                name: '范围上限',
                type: 'line',
                data: maxs,
                symbol: 'none',
                lineStyle: { width: 1, color: '#e34a4a', type: 'dashed' },
                z: 0,
            },
            {
                name: '范围下限',
                type: 'line',
                data: mins,
                symbol: 'none',
                lineStyle: { width: 1, color: '#3ba272', type: 'dashed' },
                z: 0,
            },
        ],
    });
    window.addEventListener('resize', () => chart.resize());
}

// ======== CHART: 月度趋势 ========
function renderMonthTrend(D) {
    const chart = echarts.init(document.getElementById('chartMonthTrend'));
    const months = ['2026-01','2026-02','2026-03','2026-04','2026-05'];
    const mData = months.map(m => {
        const days = D.daily.filter(d => d.date.startsWith(m));
        if (days.length === 0) return null;
        return {
            month: m,
            avg_valley: days.reduce((s,d)=>s+d.valley_val,0) / days.length,
            min_valley: Math.min(...days.map(d=>d.valley_val)),
            max_valley: Math.max(...days.map(d=>d.valley_val)),
        };
    }).filter(Boolean);

    chart.setOption({
        title: { text: '月度谷值变化趋势', left: 'center', top: 2, textStyle: { fontSize: 14, fontWeight: 500 } },
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                const idx = params[0].dataIndex;
                const m = mData[idx];
                if (!m) return '';
                return `<strong>${m.month}</strong><br/>谷值均价: ${m.avg_valley.toFixed(0)} 元/MWh<br/>最低: ${m.min_valley.toFixed(0)}<br/>最高: ${m.max_valley.toFixed(0)}`;
            }
        },
        grid: { left: 50, right: 20, top: 36, bottom: 24 },
        xAxis: {
            type: 'category',
            data: mData.map(m => m.month),
            axisLabel: { fontSize: 11 },
        },
        yAxis: { type: 'value', name: '元/MWh', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 9 } },
        series: [
            {
                name: '谷值均价',
                type: 'line',
                data: mData.map(m => ({ value: m.avg_valley.toFixed(0) })),
                smooth: true,
                symbol: 'diamond',
                symbolSize: 12,
                lineStyle: { width: 2, color: '#2a7fc9' },
                itemStyle: { color: '#2a7fc9' },
                markArea: {
                    data: mData.map(m => [
                        { yAxis: m.min_valley, itemStyle: { color: 'rgba(227,74,74,0.06)' } },
                        { yAxis: m.max_valley },
                    ]),
                },
            },
            {
                name: '谷值最低',
                type: 'bar',
                data: mData.map(m => m.min_valley.toFixed(0)),
                barWidth: 16,
                itemStyle: { color: '#e34a4a', borderRadius: [2,2,0,0] },
            },
            {
                name: '谷值最高',
                type: 'bar',
                data: mData.map(m => m.max_valley.toFixed(0)),
                barWidth: 16,
                itemStyle: { color: '#3ba272', borderRadius: [2,2,0,0] },
            },
        ],
    });
    window.addEventListener('resize', () => chart.resize());
}

// ======== TABLE ========
function renderTable(period) {
    const days = window._dailyData || [];
    const filtered = period === 'all' ? days : days.filter(d => d.valley_period.includes(period));

    let html = '';
    filtered.forEach(d => {
        const vCls = d.valley_val < 0 ? 'neg' : '';
        const vmCls = d.daily_avg < 0 ? 'neg' : '';
        const spreadCls = d.spread > 600 ? 'neg' : '';
        const tagCls = d.valley_period.includes('凌晨') ? 'tag-dawn' :
                       d.valley_period.includes('上午') ? 'tag-morning' :
                       d.valley_period.includes('中午') ? 'tag-noon' :
                       d.valley_period.includes('下午') ? 'tag-afternoon' :
                       d.valley_period.includes('傍晚') ? 'tag-eve' : 'tag-night';
        html += `<tr>
            <td>${d.date.slice(5)}</td>
            <td>周${DAY_NAMES[d.weekday]}</td>
            <td class="num ${vmCls}">${d.daily_avg.toFixed(0)}</td>
            <td class="num ${vCls}"><strong>${d.valley_val.toFixed(0)}</strong></td>
            <td>${d.valley_label}</td>
            <td><span class="tag ${tagCls}">${d.valley_period.replace(/\(.*\)/,'')}</span></td>
            <td class="num pos">${d.peak_val.toFixed(0)}</td>
            <td class="num ${spreadCls}">${d.spread.toFixed(0)}</td>
            <td class="num">${((d.spread/d.valley_val)*100).toFixed(0)}%</td>
        </tr>`;
    });

    document.getElementById('tableBody').innerHTML = html;
}

// ======== INIT ========
if (EMBEDDED_DATA && EMBEDDED_DATA !== '') {
    renderAll(EMBEDDED_DATA);
} else {
    loadData();
}
</script>
